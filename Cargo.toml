[package]
name = "hook_macro"
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.80.0"
authors = ["HFunction2013 <HFunction2013@outlook.com>"]
repository = "https://github.com/HFunction2013/hook_macro"
description = "Procedural macro for generating runtime hook system with before/on/after callbacks"
keywords = ["hook", "macro", "aop", "callback", "ffi"]
categories = ["development-tools", "development-tools::procedural-macro-helpers"]
readme = "README.md"
exclude = [".gitignore"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
safer-ffi = "0.2.0-rc1"